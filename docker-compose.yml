version: "3.9"

# Credentials are loaded from .env (gitignored).
# Copy .env.example to .env and fill in before running: cp .env.example .env
# Default dev values: POSTGRES_USER=zil, POSTGRES_PASSWORD=zil, POSTGRES_DB=zil

services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zil}
      POSTGRES_DB: ${POSTGRES_DB:-zil}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zil"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Typesense (search) ──
  typesense:
    image: typesense/typesense:27.1
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: zil-dev-key
    ports:
      - "8108:8108"
    volumes:
      - tsdata:/data

  # ── FastAPI Backend ──
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zil}:${POSTGRES_PASSWORD:-zil}@db:5432/${POSTGRES_DB:-zil}
      REDIS_URL: redis://redis:6379/0
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-zil-dev-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ENV: ${ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ──
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
      - ./apps/workers:/workers
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zil}:${POSTGRES_PASSWORD:-zil}@db:5432/${POSTGRES_DB:-zil}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENV: ${ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.tasks worker --loglevel=info --concurrency=2

  # ── Celery Beat (scheduler) ──
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
      - ./apps/workers:/workers
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zil}:${POSTGRES_PASSWORD:-zil}@db:5432/${POSTGRES_DB:-zil}
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.tasks beat --loglevel=info

  # ── Next.js Frontend ──
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    command: npm run dev

volumes:
  pgdata:
  tsdata:
