[alembic]
script_location = data/migrations
prepend_sys_path = .

# A URL real vem de DATABASE_URL (ver data/migrations/env.py).
# O valor abaixo é só fallback de desenvolvimento local via docker compose —
# nunca use credenciais reais aqui, o arquivo é versionado.
sqlalchemy.url = postgresql://zil:zil@db:5432/zil

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
