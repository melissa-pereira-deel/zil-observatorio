# Aplica a curadoria em produção quando ela entra no main: uma classificação
# mergeada em data/direcoes/ vira score no site sem passo manual.
#
# Valida os YAMLs (consultando a API da Câmara), garante que cada votação
# curada esteja no banco com seus votos, aplica as direções e recalcula o
# Score ZIL. Usa o mesmo segredo PRODUCAO_DATABASE_URL do workflow `dados`.

name: direcoes

on:
  push:
    branches: [main]
    paths: ["data/direcoes/**"]
  workflow_dispatch:

concurrency:
  group: dados-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PRODUCAO_DATABASE_URL }}
      ENV: automacao
    steps:
      - name: Conferir o segredo do banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::segredo PRODUCAO_DATABASE_URL não configurado"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - name: Validar
        run: python scripts/validar_direcoes.py --verificar-api
      - name: Sincronizar as votações curadas
        run: python scripts/sync_votacoes_zil.py
      - name: Aplicar direções e recalcular scores
        run: python scripts/agenda.py scores
