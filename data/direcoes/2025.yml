  - fonte_id: "2426923-22"
    fonte: camara
    direcao: sim
    peso: 2.0
    validacao: nao-validado
    categoria_principal: ZIL-SEM
    justificativa: >
      PL 1264/2024 — Preferência nas compras públicas para empresas
      certificadas no PADIS (Programa de Apoio ao Desenvolvimento
      Tecnológico da Indústria de Semicondutores e Displays). Parecer
      aprovado em comissão em 07/05/2025. O projeto altera a Lei
      14.744/2023 para estabelecer margem de preferência de até 25% nas
      licitações federais para produtos fabricados por empresas
      beneficiárias do PADIS. O poder de compra do Estado é instrumento
      central de política industrial em semicondutores: EUA (CHIPS Act),
      UE (European Chips Act) e China usam esse mecanismo. Votar SIM
      cria demanda doméstica garantida para fabricantes nacionais de
      chips e displays, reduzindo o risco de investimento. Peso 2.0 por
      ser votação de comissão (parecer); aguardar votação de plenário
      para atualizar para 3.0.

